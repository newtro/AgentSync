name: Validate SkillMesh source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install live Claude provider validator
        run: npm install --global @anthropic-ai/claude-code
      - run: npm test
      - run: node src/cli.js security-scan --root . --revision "${{ github.sha }}" --json
      - run: node src/cli.js validate --source . --json
      - name: Build candidates strictly before merge
        if: github.event_name == 'pull_request'
        run: node src/cli.js build --source . --out .skillmesh/ci-build --json
      - name: Build candidates with post-merge quarantine isolation
        if: github.event_name == 'push'
        run: node src/cli.js build --source . --out .skillmesh/ci-build --allow-quarantine --json
      - name: Preserve security incident evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-incidents-${{ matrix.os }}
          path: .skillmesh/security-incidents/
          if-no-files-found: ignore
          include-hidden-files: true

  source-contract:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AGENTSYNC_DISTRIBUTION_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global @anthropic-ai/claude-code
      - name: Load authoritative stable contract
        run: |
          test -n "$GH_TOKEN"
          gh repo clone newtro/AgentSync-Distribution .skillmesh/distribution
      - name: Preserve the source contract while isolating post-merge target failures
        run: node src/cli.js build --source . --out .skillmesh/contract-build --index .skillmesh/distribution/stable-index.json --commit "$GITHUB_SHA" --allow-quarantine --json

  publish-distribution:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, source-contract]
    runs-on: ubuntu-latest
    concurrency:
      group: agentsync-distribution-publication
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.AGENTSYNC_DISTRIBUTION_TOKEN }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install live Claude provider validator
        run: npm install --global @anthropic-ai/claude-code
      - name: Require distribution credential
        run: test -n "$GH_TOKEN"
      - name: Configure authenticated release Git
        run: |
          gh auth setup-git --hostname github.com
          git config --global user.name "AgentSync Release Bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Check out authoritative distribution state
        run: gh repo clone newtro/AgentSync-Distribution .skillmesh/distribution
      - name: Build candidates against authoritative provider revisions
        run: node src/cli.js build --source . --out .skillmesh/build --index .skillmesh/distribution/stable-index.json --commit "$GITHUB_SHA" --allow-quarantine --json
      - name: Promote complete candidates
        run: node src/cli.js promote --source . --build .skillmesh/build --index .skillmesh/distribution/stable-index.json --out-index .skillmesh/build/stable-index.json --json
      - name: Inspect promoted state
        id: candidates
        run: node -e "const fs=require('fs'); const source=require('./package.json').version; const prior=require('./.skillmesh/distribution/stable-index.json'); const next=require('./.skillmesh/build/stable-index.json'); const skillsChanged=JSON.stringify(prior.skills)!==JSON.stringify(next.skills); const updaterChanged=source!==prior.updater?.version; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'needed='+(skillsChanged||updaterChanged)+'\n')"
      - name: Stage stable-only distribution
        if: steps.candidates.outputs.needed == 'true'
        run: node src/cli.js publish-stage --source . --build .skillmesh/build --index .skillmesh/build/stable-index.json --distribution .skillmesh/distribution --json
      - name: Open generated distribution pull request
        if: steps.candidates.outputs.needed == 'true'
        run: node src/cli.js publish-pr --source . --distribution .skillmesh/distribution --stage .skillmesh/distribution/.skillmesh-stage --generation "$(node -p "require('./.skillmesh/build/stable-index.json').generation")" --json
      - name: Preserve security incident evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-incidents-publication
          path: .skillmesh/security-incidents/
          if-no-files-found: ignore
          include-hidden-files: true
